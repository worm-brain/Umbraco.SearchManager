name: Bug report
description: Something Search Manager does wrong. Reports welcome from humans and AI agents alike.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for filing a bug. A copy-pasteable repro beats a description.
        Reports are welcome from anyone, including AI agents - see CONTRIBUTING.md.
        (Note: filing a bug does not mean you should open a PR. PRs are issue-first and
        invitation-only; wait for this issue to be labelled `accepted` first.)
        A security problem is the exception: report it privately, as SECURITY.md describes.
  - type: input
    id: package-version
    attributes:
      label: Package version
      description: The Umbraco.Community.SearchManager version installed on the site.
      placeholder: e.g. 17.0.0
    validations:
      required: true
  - type: input
    id: umbraco-version
    attributes:
      label: Umbraco version
      placeholder: e.g. 17.7.0
    validations:
      required: true
  - type: input
    id: umbraco-search-version
    attributes:
      label: Umbraco Search version
      description: Only if the site uses Umbraco Search with the Umbraco.Community.SearchManager.UmbracoSearch adapter.
      placeholder: e.g. 17.2.0
    validations:
      required: false
  - type: dropdown
    id: index
    attributes:
      label: Index
      description: The kind of index you were working with when it went wrong.
      options:
        - A core Examine index (ExternalIndex, InternalIndex, MembersIndex or a custom one)
        - An Umbraco Search index
        - Not specific to an index
    validations:
      required: false
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: What you did, step by step, including any search text or filters. Redact secrets.
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: What happened
      description: What you saw, and any error from the browser console or the site's log.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true
  - type: input
    id: browser
    attributes:
      label: Browser
      description: For anything in the backoffice.
      placeholder: e.g. Chrome 141 on Windows 11
    validations:
      required: false
